<div class="flex justify-between mb-3">
    <div class="flex items-center gap-3">
        <h1 class="underline cursor-pointer hover:scale-110 transition ease-in-out duration-300" (click)="toList()" translate>header.suppliers</h1>
        <span class="mb-4">
            <svg class="rtl:rotate-180 w-3 h-3 text-gray-400 mx-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="m1 9 4-4-4-4" />
            </svg>
        </span>
        <h1>{{ (supplier$ | async)?.name }}</h1>
    </div>
</div>
<ng-container *ngIf="supplier$ | async as supplier">
    <div class="w-1/2">
        <table class="table-no-header">
            <tr>
                <th></th>
                <th></th>
                <th></th>
            </tr>
            <tr>
                <td translate>suppliers.list.table.name</td>
                <td>{{ supplier.name }}</td>
            </tr>
            <tr>
                <td translate>suppliers.list.table.email</td>
                <td>{{ supplier.email }}</td>
            </tr>
        </table>
    </div>
</ng-container>
