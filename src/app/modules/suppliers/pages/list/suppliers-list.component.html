<div class="flex justify-between mb-3">
    <h1 translate="">header.suppliers</h1>
</div>

<ng-container *ngIf="dataSource">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> Id </th>
            <td mat-cell *matCellDef="let element"> {{ element.id }} </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef translate>suppliers.list.table.name</th>
            <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
        </ng-container>

        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef translate>suppliers.list.table.email</th>
            <td mat-cell *matCellDef="let element"> {{ element.email }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"
            class="cursor-pointer hover:bg-blue-200 transition duration-300" (click)="selectedRow(row)">
        </tr>
    </table>
    <mat-paginator [pageSize]="20" [pageSizeOptions]="[20, 40, 80, 160]"></mat-paginator>
</ng-container>
